  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      { "@type": "Question", "name": "Who can participate in NVS International Services conferences?", "acceptedAnswer": { "@type": "Answer", "text": "Researchers, scientists, academicians, professors, research scholars, students, industry professionals, engineers, healthcare professionals, and other professionals related to the conference field can participate." } },
      { "@type": "Question", "name": "Can I attend the conference without presenting a paper?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Participants may register as delegates without presenting a paper, subject to the registration options available for the specific conference." } },
      { "@type": "Question", "name": "How can I submit an abstract?", "acceptedAnswer": { "@type": "Answer", "text": "Abstracts can be submitted through the official submission system or the submission method provided on the respective conference website. Authors should follow the abstract guidelines and deadlines specified for the conference." } },
      { "@type": "Question", "name": "How can I participate as a speaker?", "acceptedAnswer": { "@type": "Answer", "text": "Researchers and professionals may participate as speakers by submitting an abstract or by responding to an official invitation from the conference organizing team. Speaker categories may include Keynote, Plenary, Invited, Oral, and Poster presentations." } },
      { "@type": "Question", "name": "Does abstract acceptance mean my registration is confirmed?", "acceptedAnswer": { "@type": "Answer", "text": "No. Abstract acceptance and conference registration are separate processes. Accepted participants must complete the applicable registration requirements to confirm their participation." } },
      { "@type": "Question", "name": "Can I change my presentation title after submitting my abstract?", "acceptedAnswer": { "@type": "Answer", "text": "Title changes may be possible before the final conference program is prepared. Participants should contact the organizing team as early as possible for any required changes." } },
      { "@type": "Question", "name": "Does NVS provide a visa invitation letter?", "acceptedAnswer": { "@type": "Answer", "text": "Eligible international participants may request an official conference invitation or participation confirmation letter, subject to the requirements of the respective conference." } },
      { "@type": "Question", "name": "Does the invitation letter guarantee visa approval?", "acceptedAnswer": { "@type": "Answer", "text": "No. An invitation letter does not guarantee visa approval or entry into the destination country. Visa decisions are made solely by the relevant embassy, consulate, or immigration authority." } },
      { "@type": "Question", "name": "Does NVS provide flight tickets or accommodation?", "acceptedAnswer": { "@type": "Answer", "text": "Unless specifically stated otherwise, participants are responsible for their own flights and accommodation. Any available accommodation arrangements or special packages will be communicated for the respective conference." } },
      { "@type": "Question", "name": "Will my abstract or paper be published?", "acceptedAnswer": { "@type": "Answer", "text": "Depending on the conference, accepted abstracts may be included in conference materials or proceedings. Selected papers may also be considered for journal publication where applicable. Publication and indexing are subject to the policies and review procedures of the respective publisher or journal." } },
      { "@type": "Question", "name": "Can I cancel my registration?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Cancellation requests are subject to the Cancellation & Refund Policy applicable to the respective conference. Refund eligibility depends on the timing of the cancellation and the applicable conference terms." } },
      { "@type": "Question", "name": "Can I transfer my registration to another person?", "acceptedAnswer": { "@type": "Answer", "text": "A registration transfer or speaker substitution may be possible with prior approval from the organizing team. The proposed participant may need to provide relevant professional and registration details." } },
      { "@type": "Question", "name": "Are virtual participation options available?", "acceptedAnswer": { "@type": "Answer", "text": "Some conferences may offer virtual or hybrid participation. Availability depends on the specific conference and will be stated on the official conference website." } },
      { "@type": "Question", "name": "How can I become a sponsor or exhibitor?", "acceptedAnswer": { "@type": "Answer", "text": "Organizations interested in sponsorship or exhibition opportunities can contact the NVS International Services team through the official conference contact details." } },
      { "@type": "Question", "name": "How can I contact NVS International Services?", "acceptedAnswer": { "@type": "Answer", "text": "For enquiries regarding registration, abstracts, speakers, payments, visa letters, publication, accommodation, sponsorship, exhibition, or general conference information, please contact the organizing team through the official contact details provided on the respective conference website." } }
    ]
